# Docker Compose 专用配置 — 容器通过 host.docker.internal 连接宿主机 MySQL/Redis
captcha:
  tianai:
    enabled: true

spring:
  datasource:
    url: jdbc:mysql://host.docker.internal:3306/restaurant_chain?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
  data:
    redis:
      host: host.docker.internal
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true
