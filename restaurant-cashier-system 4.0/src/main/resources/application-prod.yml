captcha:
  tianai:
    enabled: true    # 生产环境开启验证码

spring:
  datasource:
    url: jdbc:mysql://mysql:3306/restaurant_chain?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
  data:
    redis:
      host: redis
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never   # 生产环境不暴露细节
      probes:
        enabled: true
