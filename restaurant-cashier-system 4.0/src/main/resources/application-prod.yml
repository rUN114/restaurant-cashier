spring:
  config:
    import:
      - optional:classpath:application-secret.yml
  datasource:
    url: jdbc:mysql://localhost:3306/restaurant_chain?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
  data:
    redis:
      host: localhost
      port: 6379

captcha:
  tianai:
    enabled: true    # 生产环境开启验证码

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never   # 生产环境不暴露细节
      probes:
        enabled: true
