services:
  backend:
    build: ./restaurant-cashier-system 4.0
    container_name: cashier-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8088:8088"

  frontend:
    build: ./cashier-front2.0
    container_name: cashier-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
